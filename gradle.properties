# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M -XX:+UseG1GC
kotlin.native.jvmArgs=-Xmx6144M -XX:+UseG1GC

# Gradle
# Optimized for Mac Mini M4 (16GB RAM) - allows sufficient memory for release linking without swapping
org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1G
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=true

# Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.enableJetifier=false

# Kotlin Native Optimization
kotlin.native.ignoreDisabledTargets=true
kotlin.native.cacheKind=static

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
